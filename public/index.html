<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>RSS Reader</title>
</head>
<body>
  <h1>RSS Articles</h1>
  <ul id="articles"></ul>

  <script>
    fetch("/api/articles")
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById("articles");
        data.forEach(article => {
          const li = document.createElement("li");
          li.innerHTML = `
            <a href="${article.link}" target="_blank">
              ${article.title}
            </a>
            <small>(${article.source})</small>>
            <p>Published on: ${new Date(article.published).toLocaleString()}</p>
            <p>By: ${article.creator || 'Unknown'}</p>
            <div>${article.content || ''}</div>
            <p>Categories: ${article.categories ? article.categories.join(', ') : 'None'}</p>
          `;
          list.appendChild(li);
        });
      });
  </script>
</body>
</html>
