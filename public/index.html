<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>RSS Reader</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="container">
        <h1>RSS Articles</h1>
        <button id="refreshBtn">Refresh feeds</button>
        <div id="articles"></div>
    </div>

    <script>
        const articlesContainer = document.getElementById("articles");
        const refreshBtn = document.getElementById("refreshBtn");

        function formatDate(date) {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(date).toLocaleDateString(undefined, options);
        }

        async function loadArticles() {
            const res = await fetch("/api/articles");
            const data = await res.json();

            // Group articles by date
            const groupedArticles = data.reduce((groups, article) => {
                const publishedDate = article.published ? new Date(article.published).toLocaleDateString() : "Unknown date";
                if (!groups[publishedDate]) {
                    groups[publishedDate] = [];
                }
                groups[publishedDate].push(article);
                return groups;
            }, {});

            articlesContainer.innerHTML = ""; // Clear previous articles

            // Create an article group for each date
            Object.keys(groupedArticles).forEach(date => {
                // Create date heading
                const dateHeading = document.createElement("h2");
                dateHeading.textContent = formatDate(date);
                articlesContainer.appendChild(dateHeading);

                // Create list for articles under the same date
                const ul = document.createElement("ul");

                groupedArticles[date].forEach(article => {
                    const li = document.createElement("li");
                    li.innerHTML = `
                        <div class="news">
                            <div>
                        <a href="${article.link}" target="_blank">
                            ${article.title}
                        </a>
                        <p><i>Published on: ${article.published
                            ? new Date(article.published).toLocaleTimeString()
                            : "Unknown date"} - ${article.source}</i></p>
                        ${article.content || ""}
                        </div>
                        <div>
                        ${article.mediaURL ? `<img src="${article.mediaURL}" alt="Article Media" style="max-width: 200px; max-height: 200px;"/>` : ""}
                        </div>
                        </div>
                    `;
                    ul.appendChild(li);
                });

                articlesContainer.appendChild(ul); // Append the list of articles
            });
        }

        refreshBtn.addEventListener("click", async () => {
            refreshBtn.disabled = true;
            refreshBtn.textContent = "Refreshing...";

            await fetch("/api/refresh", { method: "POST" });
            await loadArticles();

            refreshBtn.disabled = false;
            refreshBtn.textContent = "Refresh feeds";
        });

        // Initial load
        loadArticles();
    </script>
</body>

</html>
